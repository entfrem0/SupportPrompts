title: Support Prompts Guides
description: Questetra ワークフローのサポート記事を収録するガイド集
lang: ja
url: "https://questetra.github.io"
baseurl: "/SupportPrompts"
permalink: pretty
markdown: kramdown
highlighter: rouge
google_fonts: "https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"

collections: {}

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      sidebar_title: 同じカテゴリの記事

navigation:
  - title: ガイド集
    url: /

sections:
  date_datetime:
    title: 日付／日時データ更新
    description: 日付型・日時型データの更新手順と代表的なEL式サンプル
    url: /date_datetime/
#  test:
#    title: テスト記事
#    description: テスト記事
#    url: /test/
#  test2:
#    title: テスト記事2
#    description: テスト記事2
#    url: /test2/
  user:
    title: ユーザ型データ更新
    description: ユーザー型データの更新手順と代表的なEL式サンプル
    url: /user/
  group: 
    title: 組織型データ更新
    description: 組織型データの更新手順と代表的なEL式サンプル
    url: /group/
  select: 
    title: 選択型データ更新
    description: 選択型データの更新手順と代表的なEL式サンプル
    url: /select/


# 新しく記事を作る際は、sectionsに項目を作る。titleとdescriptionとurlも加える

kramdown:
  input: GFM
  hard_wrap: false
  toc_levels: 2..3

sass:
  style: compressed
